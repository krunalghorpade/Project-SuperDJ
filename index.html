 for(let level=before+1;level<=after;level++)log('Reached Player Level '+level+'. Unlocked: '+unlockText(level)+'.');

}

function checkGoals(){

   if(!S.goalProgress.quests.includes(key)&&questValue(quest)>=quest.target){

    log('Quest complete: '+quest.label+'. +'+goal.questXP+' XP.');notice='Quest complete: '+quest.label+' · +'+goal.questXP+' XP';

function tryFullscreen(){

async function toggleFullscreen(){
 try{
  if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();
  else if(document.documentElement.requestFullscreen&&document.fullscreenEnabled!==false)await document.documentElement.requestFullscreen();
  else toast('The game fills this browser panel. Expand the panel for more room.');
 }catch(e){toast('The game fills this browser panel. Expand the panel for more room.')}
 if(menuMode==='pause')showGameMenu();

function releaseTrack(){
 if(!levelGate(3))return;
 if(S.inspiration<20){toast('You need 20 inspiration. Sample sounds around the city landmarks or dig for records.');return}
 if(S.daily.track){toast('One release a day. Give your listeners time to hear it.');return}
 let name=$('trackName').value.trim()||['Windowlight','Monsoon local','Last train','Midnight postcards','Maximum City frequencies'][S.tracks.length%5]+' '+(S.tracks.length+1);
 if(!spend(3,24,350))return;
 let quality=Math.round(clamp(20+S.production*.45+S.gear*7+S.mood*.12+Math.min(12,S.records*2)+(S.items.includes('masterTape')?5:0),1,100));
 let fans=Math.round(quality*.5+S.fans*.025);S.inspiration-=20;S.production=clamp(S.production+8);S.tracks.push({name,quality,fans,day:S.day});S.fans+=fans;S.daily.track=1;
 finish('Released “'+name+'”. Quality '+quality+'/100, '+fans+' new listeners.',xpCosts.release+Math.round(quality/4));showStudio();
}

 }).join('');
 openModal('Your 10 primary goals','<p>All ten primary goals are visible from the start. Their quests have no deadlines. Complete the current goal to advance. Optional timed opportunities use in-game hours; accept one to start its clock. Pin up to three quests to the top-left HUD.</p><h3>Timed opportunities</h3><div class="timedQuestList">'+timedCards+'</div><h3>Primary goals</h3><div class="goalList">'+primaryGoals.map((goal,i)=>{

   const key=questKey(goal,q),paid=S.goalProgress.quests.includes(key),value=paid?q.target:questValue(q),ready=value>=q.target,pinned=S.pinnedQuests.includes(key);
   return '<div class="goalQuest '+(paid?'done':'')+'"><span>'+(paid?'✓ ':ready?'◌ ':'○ ')+esc(q.label)+(ready&&!paid?' · ready when active':'')+'</span><b>'+value+' / '+q.target+'</b>'+(paid?'':'<button onclick="'+(pinned?'unpinQuest':'pinQuest')+'(\''+key+'\')">'+(pinned?'Unpin':'Pin')+'</button>')+'</div>';

function validateSave(o){
 if(!o||![1,2].includes(o.version)||typeof o.name!=='string'||!o.friends||!o.daily||typeof o.daily!=='object'||Array.isArray(o.daily))throw Error('Invalid save');
 let base=initial();
 ['day','hour','money','debt','energy','hunger','mood','health','skill','production','inspiration','fans','rep','gear','home','records','gigs','best','x','y'].forEach(k=>{if(typeof o[k]!=='number'||!Number.isFinite(o[k])||o[k]<0||o[k]>1e9)throw Error('Invalid '+k);base[k]=o[k]});
 if(o.day<1||o.hour>24||o.gear>3||o.home>2||!Number.isInteger(o.gear)||!Number.isInteger(o.home))throw Error('Invalid progress');
 for(let k of ['energy','hunger','mood','health','skill','production','inspiration'])base[k]=clamp(base[k]);
 Object.keys(people).forEach(k=>{if(typeof o.friends[k]!=='number'||!Number.isFinite(o.friends[k]))throw Error('Invalid friend');base.friends[k]=clamp(o.friends[k])});
 if(!Array.isArray(o.tracks)||o.tracks.length>5000||!Array.isArray(o.journal)||!Array.isArray(o.achievements))throw Error('Invalid entries');
 base.tracks=o.tracks.map(t=>{if(typeof t.name!=='string'||!Number.isFinite(t.quality)||!Number.isFinite(t.day)||!Number.isFinite(t.fans))throw Error('Invalid track');return {name:t.name.slice(0,36),quality:clamp(t.quality),day:Math.max(1,t.day),fans:Math.max(0,t.fans)}});
 base.journal=o.journal.slice(0,100).map(e=>({day:Number.isFinite(e.day)?e.day:1,text:String(e.text).slice(0,600)}));
 base.achievements=o.achievements.filter(x=>typeof x==='string').slice(0,100);base.name=o.name.slice(0,20);base.partner=people[o.partner]?o.partner:null;base.daily={...o.daily};base.started=!!o.started;base.settings={sound:o.settings?.sound===true,motion:o.settings?.motion!==false};base.district=o.version===2&&districts[o.district]?o.district:'dadar';base.x=o.version===2?clamp(o.x,16,WORLD_W-16):640;base.y=o.version===2?clamp(o.y,32,WORLD_H-20):445;if(o.version===1){base.money*=10;base.debt*=10;delete base.daily.work;delete base.daily.gig;}
 if(o.xp!==undefined&&(!Number.isSafeInteger(o.xp)||o.xp<0||o.xp>1e9))throw Error('Invalid XP');
 base.xp=o.xp===undefined?legacyXP(o):o.xp;
 base.discovered=Array.isArray(o.discovered)?[...new Set(o.discovered.filter(id=>!!districts[id]))]:[base.district];
 if(!base.discovered.includes(base.district))base.discovered.push(base.district);
 const oldJournal=base.journal.map(e=>e.text);
 const oldVenues=venues.flatMap((v,i)=>oldJournal.some(text=>text.startsWith('Played '+v.name+'.'))?[i]:[]);
 const count=(value,fallback)=>Number.isSafeInteger(value)&&value>=0&&value<=1e6?value:fallback;
 base.career={jobs:count(o.career?.jobs,oldJournal.filter(text=>text.includes('shift complete')).length),collabs:count(o.career?.collabs,oldJournal.filter(text=>text.startsWith('A studio session with Mira.')).length),samples:count(o.career?.samples,oldJournal.filter(text=>text.startsWith('You sampled the local trains')).length),venues:Array.isArray(o.career?.venues)?[...new Set(o.career.venues.filter(i=>Number.isInteger(i)&&i>=0&&i<venues.length))]:oldVenues};
 const validQuestKeys=new Set(primaryGoals.flatMap(goal=>goal.quests.map(q=>questKey(goal,q))));
 const savedQuests=Array.isArray(o.goalProgress?.quests)?o.goalProgress.quests:[];
 const savedGoals=Array.isArray(o.goalProgress?.goals)?o.goalProgress.goals:[];
 base.goalProgress.quests=[...new Set(savedQuests.filter(key=>validQuestKeys.has(key)))];
 for(const goal of primaryGoals){if(!savedGoals.includes(goal.id))break;base.goalProgress.goals.push(goal.id);for(const q of goal.quests){const key=questKey(goal,q);if(!base.goalProgress.quests.includes(key))base.goalProgress.quests.push(key)}}
 base.items=Array.isArray(o.items)?[...new Set(o.items.filter(id=>!!goalItems[id]))]:[];
 for(const goal of primaryGoals)if(base.goalProgress.goals.includes(goal.id)&&goal.reward.item&&!base.items.includes(goal.reward.item))base.items.push(goal.reward.item);
 if(o.timedQuests&&typeof o.timedQuests==='object'&&!Array.isArray(o.timedQuests))for(const def of timedQuestDefs){
  const record=o.timedQuests[def.id];
  if(!record||!['active','completed','failed','gone'].includes(record.status)||!Number.isSafeInteger(record.acceptedDay)||record.acceptedDay<1||record.acceptedDay>base.day||!Number.isSafeInteger(record.startValue)||record.startValue<0||record.startValue>1e6||!Number.isFinite(record.deadlineAt)||record.deadlineAt<0||record.deadlineAt>1e10)continue;
  base.timedQuests[def.id]={status:record.status,acceptedDay:record.acceptedDay,startValue:record.startValue,deadlineAt:record.deadlineAt};
 }
 const validPins=new Set([...validQuestKeys,...timedQuestDefs.map(def=>timedKey(def.id))]);
 base.pinnedQuests=Array.isArray(o.pinnedQuests)?[...new Set(o.pinnedQuests.filter(key=>typeof key==='string'&&validPins.has(key)))].slice(0,3):[];
 base.pinnedQuests=base.pinnedQuests.filter(key=>key.startsWith('timed:')?base.timedQuests[key.slice(6)]?.status==='active':!base.goalProgress.quests.includes(key));
 return base;
}

function downloadGame(){
 const clone=document.documentElement.cloneNode(true);
 clone.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));
 for(const id of ['modalBody','menuBody','menuTabs']){const el=clone.querySelector('#'+id);if(el)el.innerHTML=''}
 for(const id of ['controlHint','saved']){const el=clone.querySelector('#'+id);if(el)el.classList.remove('visible')}
 downloadBlob('<!doctype html>\n'+clone.outerHTML,'text/html','Project-SuperDJ.html');
 toast('Offline game downloaded. Export your save to take your story with you.');
}

function workJob(id){
 const j=jobs[id];if(!j||gig)return;
 if(![district().job,district().job2].includes(id)){toast('Visit the district where this work is available.');return}
 if(!unlockedJob(j)){toast('Build the skills and following for this job first.');return}
 if((S.daily.work||0)>=2){toast('Two shifts is enough for one day. Make time for your music and yourself.');return}
 if(!spend(j.hours,j.energy))return;
 S.daily.work=(S.daily.work||0)+1;S.career.jobs++;earn(j.pay);S.mood=clamp(S.mood-3);S.production=clamp(S.production+(j.prod?2:0));S.friends.rowan=clamp(S.friends.rowan+2);
 finish(j.name+' shift complete in '+district().name+'. Earned '+rupees(j.pay)+'.',20+j.tier*15);showJobs();
}

function objective(){

function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function poly(c,pts,col){c.fillStyle=col;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill()}

function seed(n){let v=Math.sin(n*12.9898+78.233)*43758.5453;return v-Math.floor(v)}

function toggleSound(){muted=!muted;S.settings.sound=!muted;if(!muted)initAudio();save()}
function tone(freq,duration=.12,type='sine',vol=.045){
 if(muted||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.008);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+duration+.02)
}

 const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(strong?135:480,now);o.frequency.exponentialRampToValueAtTime(strong?42:140,now+.14);g.gain.setValueAtTime(strong?.13:.025,now);g.gain.exponentialRampToValueAtTime(.001,now+.16);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.18);

function hit(lane){
 if(!gig||gig.paused)return;
 const elapsed=(performance.now()-gig.start)/1000;gig.flashes[lane]=performance.now();
 let candidates=gig.notes.filter(n=>!n.done&&n.lane===lane&&Math.abs(n.t-elapsed)<.23).sort((a,b)=>Math.abs(a.t-elapsed)-Math.abs(b.t-elapsed));

 }

}

function finishGig(left){

 const v=venues[result.i],accuracy=result.score/(v.notes*100),grade=left?'—':accuracy>=.9?'S':accuracy>=.78?'A':accuracy>=.6?'B':accuracy>=.4?'C':'D';

}
